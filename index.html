  <style>
:root {
  color-scheme: light;
  --paper: #fffefa;
  --ink: #3f526b;
  --muted: #63758b;
  --blue: #729ac2;
  --blue-dark: #4b7095;
  --blue-soft: #eaf3fc;
  --pink: #eab5c3;
  --line: #dce6ef;
  --font: "Hiragino Maru Gothic ProN", "PingFang SC", "Microsoft YaHei", sans-serif;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  min-width: 280px;
  color: var(--ink);
  background-color: #f5f9fc;
  background-image:
    linear-gradient(90deg, #dcebf64d 50%, transparent 50%),
    linear-gradient(#dcebf64d 50%, transparent 50%);
  background-size: 36px 36px;
  font: 16px/1.7 var(--font);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button, label { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button:focus-visible { outline: 2px solid var(--blue-dark); outline-offset: 4px; }
[hidden] { display: none !important; }
::selection { color: #3f526b; background: #daeaf9; }

.test {
  position: relative;
  width: min(600px, calc(100% - 48px));
  margin: 44px auto 32px;
  padding: 27px 36px 24px;
  border: 1px solid #fff;
  border-radius: 28px;
  background: var(--paper);
  box-shadow: 0 10px 40px #54789b0d, 0 0 0 1px #dbe6efb3;
}
.test::before {
  content: "";
  position: absolute;
  top: -1px;
  left: 50%;
  width: 58px;
  height: 5px;
  border-radius: 0 0 5px 5px;
  background: var(--pink);
  transform: translateX(-50%);
}
.heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.heading-copy { min-width: 0; }
.heading h1 {
  display: flex;
  align-items: center;
  gap: 11px;
  margin: 0;
  color: #547da5;
  font-size: 30px;
  font-weight: 700;
  letter-spacing: 3px;
  line-height: 1.5;
}
.title-bunny { width: 27px; height: 33px; flex-shrink: 0; color: var(--blue); }
.heading p { margin: 10px 0 0; color: var(--muted); font-size: 13px; letter-spacing: .6px; }
.progress-row { display: flex; align-items: center; gap: 16px; margin: 21px 0 26px; }
progress {
  display: block;
  flex: 1;
  width: 0;
  height: 6px;
  border: 0;
  border-radius: 20px;
  appearance: none;
  background: #eaf0f5;
  overflow: hidden;
}
progress::-webkit-progress-bar { border-radius: 20px; background: #eaf0f5; }
progress::-webkit-progress-value { border-radius: 20px; background: #9cbddd; transition: width .18s ease; }
progress::-moz-progress-bar { border-radius: 20px; background: #9cbddd; }
.counter { min-width: 64px; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: 1px; text-align: right; white-space: nowrap; }
.counter span { color: var(--muted); font-size: 13px; font-weight: 400; }

fieldset { min-width: 0; margin: 0; padding: 0; border: 0; }
legend { display: block; width: 100%; min-height: 68px; margin: 0 0 24px; padding: 0; font-size: 22px; font-weight: 500; line-height: 1.85; letter-spacing: .3px; }
legend:focus, #result-title:focus { outline: none; }
.answers { display: grid; gap: 11px; }
.answer {
  position: relative;
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: 68px;
  padding: 13px 16px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #fff;
  cursor: pointer;
  transition: background .16s, border-color .16s, box-shadow .16s, transform .16s;
}
.answer input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.answer-number {
  display: grid;
  place-items: center;
  flex: 0 0 29px;
  height: 31px;
  border-radius: 9px;
  background: var(--blue-soft);
  color: #4d6e91;
  font: 600 14px/1 var(--font);
  transition: background .16s, color .16s;
}
.answer-label { flex: 1; min-width: 0; font-size: 16px; line-height: 1.8; letter-spacing: .2px; text-align: left; overflow-wrap: anywhere; }
.answer-mark { position: relative; display: block; flex: 0 0 15px; height: 15px; margin-left: 2px; border: 1px solid #cbd9e7; border-radius: 50%; }
.answer:has(input:checked) { border-color: #90b2d4; background: #eff6fe; box-shadow: 0 3px 0 #dae8f5; }
.answer:has(input:checked) .answer-number { color: #fff; background: var(--blue-dark); }
.answer:has(input:checked) .answer-mark { border-color: var(--blue); background: var(--blue); }
.answer:has(input:checked) .answer-mark::after { content: ""; position: absolute; top: 2px; left: 4px; width: 4px; height: 7px; border-right: 1.5px solid #fff; border-bottom: 1.5px solid #fff; transform: rotate(45deg); }
.answer:has(input:focus-visible) { outline: 2px solid var(--blue-dark); outline-offset: 3px; }
.answer:has(input:disabled) { cursor: default; }
.navigation { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-top: 23px; }
button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 44px; padding: 8px 17px; border: 1px solid #e0e9f1; border-radius: 22px; background: #f0f6fb; color: var(--blue-dark); font-size: 14px; letter-spacing: .3px; transition: background .16s, border-color .16s; }
button:disabled { color: #9aa9ba; border-color: #eaf0f5; background: #f8fafb; cursor: default; }
.coffee { width: 44px; height: 38px; margin-right: 3px; color: #aac1d8; transform: rotate(-7deg); }
.noscript { font-size: 16px; text-align: center; }

.result { padding: 24px 0 20px; text-align: center; }
.result h2 { margin: 0; font-size: 21px; font-weight: 500; letter-spacing: 2px; }
.score { position: relative; display: flex; align-items: baseline; justify-content: center; gap: 12px; width: 230px; margin: 30px auto 0; padding: 16px 0 12px; font-variant-numeric: tabular-nums; }
.score::before { content: ""; position: absolute; z-index: 0; inset: -10px 10px; border: 1px dashed #c6d9ed; border-radius: 50%; background: #eff6fd; transform: rotate(-9deg); }
.score strong { position: relative; color: var(--blue-dark); font-family: Georgia, "Times New Roman", serif; font-size: 100px; font-weight: 400; line-height: 1.2; letter-spacing: -4px; }
.score > span { position: relative; color: var(--muted); font-size: 16px; }
.result button { margin-top: 38px; min-width: 132px; border-color: #d2e3f3; background: #eaf3fc; }

@media (hover: hover) and (pointer: fine) {
  .answer:hover:not(:has(input:disabled)) { border-color: #a9c3de; background: #f5f9fe; box-shadow: 0 3px 0 #e9f0f7; transform: translateY(-1px); }
  button:hover:not(:disabled) { border-color: #bfd5e9; background: #e5f0fa; }
}
@media (max-width: 600px) {
  body { background-size: 28px 28px; }
  .test { width: calc(100% - 24px); max-width: 440px; margin: 24px auto; padding: 20px 20px 21px; border-radius: 23px; }
  .heading { gap: 10px; }
  .heading h1 { gap: 8px; font-size: 28px; letter-spacing: 2px; }
  .title-bunny { width: 23px; height: 29px; }
  .heading p { margin-top: 8px; font-size: 12px; letter-spacing: .2px; }
  .progress-row { gap: 13px; margin: 18px 0 23px; }
  .counter { min-width: 61px; font-size: 14px; }
  .counter span { font-size: 12px; }
  legend { min-height: 65px; margin-bottom: 21px; font-size: 21px; line-height: 1.8; }
  .answers { gap: 10px; }
  .answer { gap: 11px; min-height: 70px; padding: 12px; border-radius: 14px; }
  .answer-number { flex-basis: 28px; height: 30px; border-radius: 8px; font-size: 13px; }
  .answer-label { font-size: 16px; letter-spacing: 0; }
  .answer-mark { flex-basis: 13px; height: 13px; margin-left: 0; }
  .answer:has(input:checked) .answer-mark::after { top: 1px; left: 3px; }
  .navigation { margin-top: 20px; }
  .result { padding-top: 22px; }
  .result h2 { font-size: 20px; }
}
@media (max-width: 360px) {
  .test { width: calc(100% - 20px); margin-top: 18px; padding: 18px 16px; }
  .heading { gap: 7px; }
  .heading h1 { gap: 7px; font-size: 26px; letter-spacing: 1px; }
  .heading p { font-size: 12px; letter-spacing: 0; }
  .title-bunny { width: 21px; }
  legend { font-size: 20px; }
  .answer { gap: 9px; padding: 11px; }
  .answer-number { flex-basis: 26px; height: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
}
  </style>
</head>
<body>
  <main class="test" id="main">
    <header class="heading">
      <div class="heading-copy">
        <h1><svg class="title-bunny" viewBox="0 0 32 36" fill="none" aria-hidden="true"><path d="M10 17C5 6 9 1 12 4c2 2 2 8 2 12m4 0c0-5 0-11 3-12 4-2 5 4 1 13" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M27 24c0 6-5 9-11 9S5 30 5 24s5-10 11-10 11 4 11 10Z" fill="var(--blue-soft)" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="23" r="1.2" fill="currentColor"/><circle cx="20" cy="23" r="1.2" fill="currentColor"/><path d="m15 27 1 1 1-1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M8 26h2m12 0h2" stroke="var(--pink)" stroke-width="2.5" stroke-linecap="round"/></svg>萝莉程度</h1>
        <p>选择最接近你实际反应的一项</p>
      </div>
    </header>
    <div class="progress-row">
      <progress id="progress" value="0" max="25" aria-label="作答进度">0 / 25</progress>
      <span class="counter" id="counter" aria-label="当前题目">01 <span>/ 25</span></span>
    </div>
    <section id="question-view" aria-label="问卷">
      <fieldset id="question-card">
        <legend id="question-text" tabindex="-1"></legend>
        <div id="answers" class="answers"></div>
      </fieldset>
      <div class="navigation">
        <button type="button" id="previous" disabled><span aria-hidden="true">←</span> 上一题</button>
        <svg class="coffee" viewBox="0 0 56 48" fill="none" aria-hidden="true"><path d="M21 11c-4-3 2-5 0-8m8 8c-4-3 2-5 0-8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M38 20h4a6 6 0 0 1 0 12h-6" stroke="currentColor" stroke-width="1.8"/><path d="M12 18h26v12a11 11 0 0 1-11 11h-4a11 11 0 0 1-11-11V18Z" fill="var(--blue-soft)" stroke="currentColor" stroke-width="1.8"/><path d="M8 44h35" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M25 32s-5-3-5-6c0-3 4-4 5-1 2-3 6-2 6 1 0 3-6 6-6 6Z" fill="var(--pink)"/><path d="m47 8 1 3 3 1-3 1-1 3-1-3-3-1 3-1 1-3Z" fill="var(--pink)"/></svg>
      </div>
    </section>
    <section id="result-view" class="result" aria-labelledby="result-title" hidden>
      <h2 id="result-title" tabindex="-1">你的萝莉程度</h2>
      <p class="score"><strong id="score">0</strong><span>/ 100</span></p>
      <button type="button" id="restart">重新测试 <span aria-hidden="true">↻</span></button>
    </section>
    <noscript><p class="noscript">请启用 JavaScript 后作答。</p></noscript>
  </main>
  <script>
/* 萝莉程度 v3.0
 * 原生 JavaScript，无依赖、无网络请求、无持久化存储。
 * 25 道场景化行为偏好题，选项顺序在每轮开始时打乱。
 * 分值为作者预设的娱乐规则，不是基于女童样本估计的心理测量参数。
 * 未经信效度及抗刻意作答验证；不能推断心理年龄或女童相似度。
 */
(function () {
  'use strict';

  // 五类内容交错覆盖不同日常场合，仅作编题组织，不是已验证的因子。
  // 选项分值与呈现位置分离；每题使用 0–4 分的预设规则，不设正确答案。
  const questions = [
    {
      domain: '即兴联想',
      text: '你提前半小时到了车站，已经办妥所有手续。坐下来后，你最可能做什么？',
      options: [
        { text: '把到站后的路线和要办的事再理一遍', points: 0 },
        { text: '给窗外经过的几个人编一段短故事', points: 4 },
        { text: '找个舒服的位置，听一会儿收藏的音乐', points: 1 },
        { text: '留意周围的标牌，找找有意思的细节', points: 2 },
        { text: '用候车厅里的东西给自己出一道找规律的题', points: 3 }
      ]
    },
    {
      domain: '表达外显',
      text: '你和朋友排了很久的队，到门口才得知今天提前结束营业。离开时，你更像哪种反应？',
      options: [
        { text: '先提议找个地方坐下，稍后再聊这件事', points: 1 },
        { text: '马上说出失落，边走边讲自己原本有多期待', points: 4 },
        { text: '把这次白排队讲成一个笑话，和朋友一起吐槽', points: 3 },
        { text: '说一句真可惜，接着商量下一站去哪儿', points: 2 },
        { text: '先查附近还开门的店，把新的地址发给朋友', points: 0 }
      ]
    },
    {
      domain: '关系协作',
      text: '你第一次参加桌游聚会，对游戏规则还不熟悉。正式开局前，你通常会怎样准备？',
      options: [
        { text: '先看别人玩一轮，再决定自己怎样加入', points: 1 },
        { text: '请熟悉的人和自己搭档，一起完成第一轮', points: 4 },
        { text: '自己看一遍简版规则，边玩边确认细节', points: 0 },
        { text: '请旁边的人先带自己试走几步', points: 3 },
        { text: '和另一个新手交换理解，再各自开始', points: 2 }
      ]
    },
    {
      domain: '细节寄情',
      text: '旅行结束后，你从包里翻出一张折皱的门票。没有收藏任务，也不需要报销。你更可能怎样处理？',
      options: [
        { text: '拍下票上的信息，和旅行照片放在一起', points: 1 },
        { text: '夹进随身本子，偶尔翻到时再想起那天', points: 4 },
        { text: '和同行的人聊聊门票上的场景，再决定去留', points: 2 },
        { text: '把门票和当天的小物件整理成一页纪念', points: 3 },
        { text: '确认没有要用的信息后，和废纸一起处理', points: 0 }
      ]
    },
    {
      domain: '熟悉偏好',
      text: '你原本打算在周末常去的店吃饭，出门前发现店铺临时休息。时间和预算都充裕，你更倾向怎样改安排？',
      options: [
        { text: '去一直想试、但还没去过的另一家店', points: 0 },
        { text: '找一家同样安静、菜式也接近的店', points: 3 },
        { text: '改到另一个自己很熟悉的地方', points: 4 },
        { text: '让同行的人推荐一个地方，再一起去', points: 1 },
        { text: '从附近几家评价不错的店里临时选一家', points: 2 }
      ]
    },
    {
      domain: '即兴联想',
      text: '你在整理旧笔记时，发现一张只画了几条线的便签。手边正好有笔，你会更想接着做什么？',
      options: [
        { text: '沿着线补成一个随手想到的人物', points: 4 },
        { text: '把空白部分留着，之后用来记东西', points: 0 },
        { text: '猜一猜自己当时为什么画下这些线', points: 2 },
        { text: '添几笔，让线条变成一个完整图案', points: 3 },
        { text: '把便签夹回原处，接着整理笔记', points: 1 }
      ]
    },
    {
      domain: '表达外显',
      text: '你在群聊里分享了一件期待已久的小进展，却暂时没有收到回复。你接下来最可能怎么做？',
      options: [
        { text: '单独发给一个熟悉的人，再聊聊自己的心情', points: 3 },
        { text: '先做手上的事，晚些时候再看群聊', points: 0 },
        { text: '补一句自己的感受，让大家知道这件事有多特别', points: 4 },
        { text: '把过程记在自己的备忘录里', points: 1 },
        { text: '等有人回复后，再根据话题接着聊', points: 2 }
      ]
    },
    {
      domain: '关系协作',
      text: '你在手工活动里遇到一个总做不好的步骤。材料可以重来，身边也有熟悉的人。你更可能采取哪种办法？',
      options: [
        { text: '换一份图解，自己再试几次', points: 0 },
        { text: '请身边的人陪着自己做完这一段', points: 4 },
        { text: '暂停自己的作品，先看看别人的做法', points: 1 },
        { text: '请人示范一次，再照着自己做', points: 2 },
        { text: '和旁边的人分着试，随时互相确认', points: 3 }
      ]
    },
    {
      domain: '细节寄情',
      text: '你收到一个很实用的小礼物，包装上还留着赠送者随手画的图案。拆开之后，你更可能怎么做？',
      options: [
        { text: '把图案拍下来，包装按平常方式处理', points: 2 },
        { text: '剪下画着图案的部分，放到经常能看到的地方', points: 4 },
        { text: '把包装叠好，连同礼物说明一起留存', points: 1 },
        { text: '给赠送者回一张照片，包装处理后开始使用礼物', points: 0 },
        { text: '把这张包装纸留在专门装纪念物的盒子里', points: 3 }
      ]
    },
    {
      domain: '熟悉偏好',
      text: '你在外地住一晚，房间安静、设施也齐全。睡前还有一小时，你更愿意怎样度过？',
      options: [
        { text: '按平时的顺序洗漱，听自己熟悉的内容', points: 4 },
        { text: '看看当地的活动介绍，想想明天还能去哪儿', points: 0 },
        { text: '试试房间里的新设备，随意安排这段时间', points: 1 },
        { text: '保留一个平时的习惯，其他安排随当天状态', points: 2 },
        { text: '把常用物品摆在顺手的位置，再按惯常方式休息', points: 3 }
      ]
    },
    {
      domain: '即兴联想',
      text: '你和朋友在散步时遇到一段很长的回声通道，周围没有其他人。你更可能怎样走过这段路？',
      options: [
        { text: '试几种不同的声音，听听回声有什么变化', points: 3 },
        { text: '继续原来的聊天，照常穿过通道', points: 0 },
        { text: '和朋友临时编一段一来一回的对白', points: 4 },
        { text: '拍一张通道的照片，继续往前走', points: 1 },

      options: [

    },

      text: '你清理手机相册时，看到一张技术上很模糊、却记录了一次开心聚会的照片。你通常会怎样处理？',
      options: [

      ]
    },
    {

      options: [

    },

      options: [

      ]
    },
    {

      options: [

      ]
    },
    {
      domain: '关系协作',
      text: '你刚接触一项新的休闲活动，独自练习和约人一起练习都很方便。最初几次，你更愿意怎样安排？',
      options: [
        { text: '先自己摸索，积累一些问题后再请教别人', points: 0 },
        { text: '和熟悉的人固定结伴，边练边互相回应', points: 4 },
        { text: '找人示范一次，之后按自己的节奏练', points: 1 },
        { text: '每次约一两个伙伴，遇到问题就一起试', points: 3 },
        { text: '自己练习与约人练习交替进行', points: 2 }
      ]
    },
    {
      domain: '细节寄情',
      text: '你用同样的预算布置桌面，照明和收纳都已经够用。剩下一小块空位，你更愿意放什么？',
      options: [
        { text: '一件和某次共同经历有关的小纪念物', points: 4 },
        { text: '暂时留空，给之后要用的东西留位置', points: 0 },
        { text: '一张和房间色调搭配的图片', points: 1 },
        { text: '一件经常拿在手里把玩、又有特别来历的小物件', points: 3 },
        { text: '一株容易照料、看着舒服的小植物', points: 2 }
      ]
    },
    {
      domain: '熟悉偏好',
      text: '你常参加的线下活动换了一个同样方便的新场地，时间和内容都没变。提前到场后，你最可能先做什么？',
      options: [
        { text: '把新场地转一圈，看看和旧地方有什么不同', points: 0 },
        { text: '找一个和以前相近的座位，按平时的方式准备', points: 4 },
        { text: '先了解出入口和活动区域，再随意找位置', points: 1 },
        { text: '找到常见的同伴，尽量延续原来的座位安排', points: 3 },
        { text: '挑一个看起来舒服的位置，再慢慢熟悉环境', points: 2 }
      ]
    }
  ];

  const $ = (id) => document.getElementById(id);
  // 保存的是选项身份而非屏幕位置；同一轮返回时保持原排列。
  let answers = Array(questions.length).fill(null);
  let optionOrders = makeOptionOrders();
  let current = 0;
  let advancing = false;
  let transitionTimer = null;
  let finished = false;

  function makeOptionOrders() {
    return questions.map((question) => {
      const order = question.options.map((_, index) => index);
      for (let index = order.length - 1; index > 0; index -= 1) {
        const other = Math.floor(Math.random() * (index + 1));
        [order[index], order[other]] = [order[other], order[index]];
      }
      return order;
    });
  }

  // 总分为选中选项的固定分值之和（25 × 0–4 = 0–100）。
  // 随机排列不会改变同一组选择的得分；不按位置、用时或答题模式加减分。
  function calculateScore(values) {
    if (!Array.isArray(values) || values.length !== questions.length ||
        values.some((value, index) => !Number.isInteger(value) || value < 0 || value >= questions[index].options.length)) {
      return null;
    }
    return values.reduce((sum, value, index) => {
      return sum + questions[index].options[value].points;
    }, 0);
  }

  function updateProgress() {
    const completed = answers.filter((value) => value !== null).length;
    $('progress').value = completed;
    $('progress').textContent = completed + ' / 25';
    $('counter').firstChild.textContent = String(current + 1).padStart(2, '0') + ' ';
    $('counter').setAttribute('aria-label', '第 ' + (current + 1) + ' 题，共 25 题');
    $('previous').disabled = current === 0 || advancing;
  }

  function choose(value) {
    if (advancing || finished) return;
    advancing = true;
    answers[current] = value;
    $('question-card').disabled = true;
    updateProgress();
    // 短暂保留选中反馈；无需点击下一题。
    transitionTimer = setTimeout(() => {
      if (current < questions.length - 1) {
        current += 1;
        renderQuestion(true);
      } else {
        showResult();
      }
    }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 60 : 180);
  }

  function renderQuestion(focus) {
    clearTimeout(transitionTimer);
    advancing = false;
    finished = false;
    $('question-card').disabled = false;
    $('question-view').hidden = false;
    $('result-view').hidden = true;
    $('question-text').textContent = questions[current].text;
    const fragment = document.createDocumentFragment();
    optionOrders[current].forEach((value, displayIndex) => {
      const option = questions[current].options[value];
      const label = document.createElement('label');
      label.className = 'answer';
      const input = document.createElement('input');
      input.type = 'radio';
      input.name = 'answer';
      input.value = String(value);
      input.checked = answers[current] === value;
      // 返回上一题后，再次点击原答案也会继续；箭头键更改选项同样生效。
      input.addEventListener('click', () => { choose(value); });
      input.addEventListener('change', () => { choose(value); });
      label.addEventListener('click', (event) => {
        if (event.detail > 1) { event.preventDefault(); }
      }, true);
      const number = document.createElement('span');
      number.className = 'answer-number';
      number.setAttribute('aria-hidden', 'true');
      number.textContent = 'ABCDE'[displayIndex];
      const text = document.createElement('span');
      text.className = 'answer-label';
      text.textContent = option.text;
      const mark = document.createElement('span');
      mark.className = 'answer-mark';
      mark.setAttribute('aria-hidden', 'true');
      label.append(input, number, text, mark);
      fragment.append(label);
    });
    $('answers').replaceChildren(fragment);
    updateProgress();
    if (focus) {
      $('question-text').focus({ preventScroll: true });
      if (window.scrollY > 0) window.scrollTo({ top: 0, behavior: 'instant' });
    }
  }

  function showResult() {
    const score = calculateScore(answers);
    if (score === null) {
      current = Math.max(0, answers.indexOf(null));
      renderQuestion(true);
      return;
    }
    finished = true;
    advancing = false;
    $('question-view').hidden = true;
    $('result-view').hidden = false;
    $('score').textContent = String(score);
    $('counter').setAttribute('aria-label', '已完成全部 25 题');
    document.title = '萝莉程度 · ' + score + ' / 100';
    $('result-title').focus({ preventScroll: true });
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  $('previous').addEventListener('click', () => {
    if (advancing || current === 0) return;
    current -= 1;
    renderQuestion(true);
  });
  $('restart').addEventListener('click', () => {
    clearTimeout(transitionTimer);
    answers = Array(questions.length).fill(null);
    optionOrders = makeOptionOrders();
    current = 0;
    document.title = '萝莉程度';
    renderQuestion(true);
  });
  document.addEventListener('keydown', (event) => {
    if (finished || advancing || event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
    const key = event.key.toLowerCase();
    const displayIndex = /^[1-5]$/.test(key) ? Number(key) - 1 : 'abcde'.indexOf(key);
    if (displayIndex < 0 || displayIndex > 4 || key.length !== 1) return;
    event.preventDefault();
    const value = optionOrders[current][displayIndex];
    const input = document.querySelector('input[name="answer"][value="' + value + '"]');
    input.checked = true;
    choose(value);
  });

  // 清理旧版同源问卷自行建立的保存项，不触碰其他存储。
  try { localStorage.removeItem('little-me.progress.v1'); } catch (_) { /* 私密模式可正常作答 */ }
  renderQuestion(false);
})();
